# FIXME: duplicated steps need to be modualized
# FIXME: add test and some static code checking steps
name: Build and Push Docker image to ACR (vote)

on:
  workflow_dispatch:
  pull_request: 
    branches:
      - master
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'
  push:
    branches:
      - master
    paths:
      - 'vote/**'
      - '.github/workflows/call-docker-build-vote.yaml'

permissions:
  id-token: write
  contents: read

env:
  ACR_NAME: gitopsdevacr      
  IMAGE_NAME: vote         
  DOCKERFILE_PATH: vote/Dockerfile
  CONTEXT_PATH: vote

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Extract version from pyproject.toml
        id: get_version
        run: |
          VERSION=$(grep -Po '(?<=^version = ")[^"]+' ${CONTEXT_PATH}/pyproject.toml)
          echo "App version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: |
          docker build -f $DOCKERFILE_PATH -t $ACR_NAME.azurecr.io/$IMAGE_NAME:${{ steps.get_version.outputs.VERSION }} ${CONTEXT_PATH}

      - name: Log in to Azure (OICD)
      #  if: github.ref == 'refs/heads/master'
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          # this secret should contain JSON output from `az ad sp create-for-rbac`

      - name: Docker build and push to ACR
      #  #if: github.ref == 'refs/heads/master'
        run: |
          az acr login --name $ACR_NAME
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          docker push $ACR_NAME.azurecr.io/$IMAGE_NAME:$VERSION
